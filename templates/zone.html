<!doctype html><html><head><meta charset="utf-8"><title>Zone Editor</title><style>
body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 30px;display:flex;justify-content:space-between}header a{color:white;margin-left:12px}.main{max-width:1150px;margin:25px auto;padding:0 15px}.card{background:white;padding:22px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 8px #0001}button{padding:10px 15px;border:0;border-radius:6px;margin:4px;cursor:pointer}.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.orange{background:#ea580c;color:#fff}input,select{padding:10px;border:1px solid #ccc;border-radius:6px}textarea{width:100%;height:440px;box-sizing:border-box;font-family:monospace;padding:12px}pre{background:#111827;color:white;padding:15px;white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap}.zone{padding:12px;border-bottom:1px solid #ddd}.small{color:#6b7280;font-size:13px}.error{background:#fee2e2;padding:10px}
</style></head><body><header><b>FreeBSD CoreDNS Manager</b><span>{{.User}} <a href="/">Dashboard</a><a href="/zones">Zones</a><a href="/logout">Logout</a></span></header><main class="main"><div class="card"><a href="/zones">← Zones</a><h1>Edit Zone: {{.Zone}}</h1>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form method="post" action="/zones/save"><input type="hidden" name="zone" value="{{.Zone}}"><p class="small">Edit the zone file.</p><textarea name="zonefile">{{.ZoneText}}</textarea><br><button class="blue">Save Zone</button></form></div><div class="card"><h2>Add DNS Record</h2><form class="row" method="post" action="/zones/record/add"><input type="hidden" name="zone" value="{{.Zone}}"><select name="type"><option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>NS</option><option>TXT</option><option>PTR</option></select><input name="name" placeholder="@ / www / mail" required><input name="value" placeholder="value" required><input name="priority" placeholder="MX priority"><button class="green">Add Record</button></form><p class="small">MX requires a numeric priority. TXT is quoted automatically.</p></div><div class="card"><form method="post" action="/zones/delete" onsubmit="return confirm('Delete zone?')"><input type="hidden" name="zone" value="{{.Zone}}"><button class="red">Delete Zone</button></form></div></main></body></html>
